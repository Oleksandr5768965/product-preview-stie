<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Product preview card component</title>
  <style>
    .attribution { font-size: 11px; text-align: center; margin-bottom: 0;}
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
<div class="main-container">
  <div class="image-container">
    <picture>
      <source media="(max-width: 375px)" srcset="/images/image-product-mobile.png">
      <source media="(max-width: 1440px)" srcset="/images/image-product-desktop.jpg">
      <img src="/images/image-product-desktop.jpg" alt="Responsive image">
    </picture>
  </div>
  <div class="content-container">
    <p class="title">Perfume</p>
    <h1 class="product-name">Gabrielle Essence Eau De Parfum</h1>
    <p class="product-description">A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL.</p>
    <p class="price">$149.99</p>
    <p class="previous-price">$169.99</p>
    <button class="add-to-cart-btn"><span class="btn-text">Add to Cart</span></button>
  </div>
</div>
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Alex</a>.
  </div>
</body>
</html>
